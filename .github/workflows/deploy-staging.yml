name: Deploy to Staging (local build)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  get-env:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.set.outputs.branch }}
      environment: ${{ steps.set.outputs.environment }}
    steps:
      - name: Set environment info
        id: set
        run: |
          echo "branch=develop" >> $GITHUB_OUTPUT
          echo "environment=staging" >> $GITHUB_OUTPUT

  deploy:
    needs: get-env
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEVELOP_HOST }}
          username: ${{ secrets.DEVELOP_USERNAME }}
          key: ${{ secrets.DEVELOP_KEY }}
          script: |
            echo "📁 Acessando projeto"
            cd /root/thanus-ai

            echo "🔀 Garantindo que estamos na branch develop"
            git fetch origin
            git checkout develop || git checkout -b develop
            git reset --hard origin/develop
            git pull origin develop

            echo "📝 Escrevendo arquivos .env"
            echo "${{ secrets.develop.BACKEND_ENV }}" > backend/.env
            echo "${{ secrets.develop.FRONTEND_ENV }}" > frontend/.env
            echo "${{ secrets.develop.FRONTEND_ENV }}" > frontend/.env.staging
            echo "${{ secrets.develop.FRONTEND_ENV }}" > frontend/.env.local

            echo "🚀 Subindo aplicação com novo build"
            docker compose up -d --build

            echo "🧼 Limpando imagens e redes não utilizadas"
            docker system prune -a -f
