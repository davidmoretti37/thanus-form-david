name: Deploy to Staging (local build)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  get-env:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.set.outputs.branch }}
      environment: ${{ steps.set.outputs.environment }}
    steps:
      - name: Set environment info
        id: set
        run: |
          echo "branch=develop" >> $GITHUB_OUTPUT
          echo "environment=staging" >> $GITHUB_OUTPUT

  deploy:
    needs: get-env
    runs-on: ubuntu-latest
    environment: develop  # Carrega os secrets BACKEND_ENV, FRONTEND_ENV, ENV_MODE
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEVELOP_HOST }}           # ← segredo global
          username: ${{ secrets.DEVELOP_USERNAME }}   # ← segredo global
          key: ${{ secrets.DEVELOP_KEY }}             # ← segredo global
          script: |
            echo "📁 Acessando projeto"
            cd /root/thanus-ai

            echo "🔀 Garantindo que estamos na branch develop"
            git fetch origin
            git checkout develop || git checkout -b develop
            git reset --hard origin/develop
            git pull origin develop

            echo "📝 Escrevendo arquivos .env com ENV_MODE=${{ secrets.ENV_MODE }}"
            rm backend/.env
            echo "${{ secrets.BACKEND_ENV }}" > backend/.env
            # Remover qualquer linha ENV_MODE existente e adicionar a nova
            sed -i '/ENV_MODE=/d' backend/.env
            echo "ENV_MODE=${{ secrets.ENV_MODE }}" >> backend/.env
            
            
            rm frontend/.env
            rm frontend/.env.staging
            rm frontend/.env.local
            echo "${{ secrets.FRONTEND_ENV }}" > frontend/.env
            echo "${{ secrets.FRONTEND_ENV }}" > frontend/.env.staging
            echo "${{ secrets.FRONTEND_ENV }}" > frontend/.env.local
            # Remover qualquer linha NEXT_PUBLIC_ENV_MODE existente e adicionar a nova
            sed -i '/NEXT_PUBLIC_ENV_MODE=/d' frontend/.env
            sed -i '/NEXT_PUBLIC_ENV_MODE=/d' frontend/.env.staging
            sed -i '/NEXT_PUBLIC_ENV_MODE=/d' frontend/.env.local
            echo "NEXT_PUBLIC_ENV_MODE=${{ secrets.ENV_MODE }}" >> frontend/.env
            echo "NEXT_PUBLIC_ENV_MODE=${{ secrets.ENV_MODE }}" >> frontend/.env.staging
            echo "NEXT_PUBLIC_ENV_MODE=${{ secrets.ENV_MODE }}" >> frontend/.env.local

            echo "🚀 Subindo aplicação com novo build"
            docker compose up -d --build

            echo "🧼 Limpando imagens e redes não utilizadas"
            docker system prune -a -f
