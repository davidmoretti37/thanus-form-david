name: Deploy to Staging (local build)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  get-env:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.set.outputs.branch }}
      environment: ${{ steps.set.outputs.environment }}
    steps:
      - name: Set environment info
        id: set
        run: |
          echo "branch=develop" >> $GITHUB_OUTPUT
          echo "environment=staging" >> $GITHUB_OUTPUT

  deploy:
    needs: get-env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEVELOP_HOST }}
          username: ${{ secrets.DEVELOP_USERNAME }}
          key: ${{ secrets.DEVELOP_KEY }}
          script: |
            # Backend
            cd /root/thanus-ai/backend
            git pull
            echo "${{ secrets.BACKEND_ENV }}" > .env
            docker compose up -d --build

            # Frontend
            cd /root/thanus-ai/frontend
            git pull
            echo "${{ secrets.develop.FRONTEND_ENV }}" > .env.staging
            echo "${{ secrets.develop.FRONTEND_ENV }}" > .env
            docker compose up -d --build
