name: Build, push and deploy to Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  get-env:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.set.outputs.branch }}
      environment: ${{ steps.set.outputs.environment }}
    steps:
      - name: Get environment info
        id: set
        shell: bash
        run: |
          if [[ "${GITHUB_REF#refs/heads/}" == "develop" ]]; then
            echo "branch=develop" >> $GITHUB_OUTPUT
            echo "environment=dev" >> $GITHUB_OUTPUT
          else
            echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

  build-backend:
    needs: get-env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create .env for backend
        run: |
          echo "BACKEND_ENV=${{ needs.get-env.outputs.environment }}" > ./backend/.env

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/arm64, linux/amd64
          tags: ghcr.io/${{ github.repository }}/thanus-backend:${{ needs.get-env.outputs.branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BACKEND_ENV=${{ needs.get-env.outputs.environment }}

  build-frontend:
    needs: get-env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create .env for frontend
        run: |
          echo "FRONTEND_ENV=${{ needs.get-env.outputs.environment }}" > ./frontend/.env

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}/thanus-frontend:${{ needs.get-env.outputs.branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            FRONTEND_ENV=${{ needs.get-env.outputs.environment }}

  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to development via SSH
        if: needs.get-env.outputs.environment == 'dev'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEVELOP_HOST }}
          username: ${{ secrets.DEVELOP_USERNAME }}
          key: ${{ secrets.DEVELOP_KEY }}
          script: |
            # Deploy backend
            cd /root/thanus-ai/backend
            git pull
            docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

            # Deploy frontend
            cd /root/thanus-ai/frontend
            git pull
            docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

      - name: Deploy to staging via SSH
        if: needs.get-env.outputs.environment == 'staging'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_KEY }}
          script: |
            cd /home/thanus/backend
            git pull
            docker compose up -d --build

            cd /home/thanus/frontend
            git pull
            docker compose up -d --build
